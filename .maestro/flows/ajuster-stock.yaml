# SCAN-21 : rejouer un parcours complet avec Maestro.
# Rechercher un produit, ouvrir sa fiche, modifier le stock (+2 puis -1),
# vérifier le catalogue, puis remettre la donnée de départ.
#
# Prérequis : `bun run api:reset` puis `bun run api` ; `bunx expo start`.
# Si le scénario échoue en cours de route, le stock reste modifié :
# relancez `bun run api:reset` avant de le rejouer.
#
# L'adresse d'Expo Go est un PARAMÈTRE (-e), jamais écrite ici : elle change
# d'un réseau et d'un poste à l'autre. Elle s'affiche dans le terminal d'Expo.
#   maestro test -e EXPO_URL=exp://192.168.1.10:8081 .maestro/flows/ajuster-stock.yaml
#
# appId : Expo Go s'appelle host.exp.Exponent sur iOS (simulateur) et
# host.exp.exponent sur Android (téléphone ou émulateur). Sur Android, changer la valeur ci-dessous.
# Avec l'APK du Module 11 : appId dev.scanstock.app et `launchApp` à la place de `openLink`.
appId: host.exp.Exponent
name: Ajuster le stock depuis la fiche produit
---
# Partir d'un état connu : si l'application est restée ouverte sur une fiche,
# rouvrir le lien ne la ramène pas au catalogue. On arrête donc Expo Go avant
# d'ouvrir le projet, qui redémarre alors sur son premier écran.
- stopApp
- openLink: ${EXPO_URL}

# Ces deux étapes couvrent un premier lancement (boîte de dialogue système,
# écran d'accueil du menu développeur d'Expo Go) : on les ferme si elles sont
# là, sans faire échouer le scénario quand elles n'apparaissent pas.
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Continue"
    optional: true

# Aucun `sleep` : Maestro attend de lui-même qu'un élément apparaisse avant
# d'agir dessus. Seul le premier chargement dans Expo Go (téléchargement du
# bundle JavaScript) dépasse le délai par défaut : `extendedWaitUntil`
# lui laisse jusqu'à 60 secondes, puis le scénario continue dès que l'écran est prêt.
- extendedWaitUntil:
    visible: "Rechercher un produit"
    timeout: 60000

# Rechercher. « nutella » trouve la pâte à tartiner par sa marque.
# Le libellé de chaque carte est « Ouvrir la fiche de <nom>, <stock> » : le texte
# d'un sélecteur Maestro est une expression régulière sur le texte entier,
# d'où le `.*` pour ne pas dépendre du début du libellé.
- tapOn: "Rechercher un produit"
- inputText: "nutella"
# Le clavier iOS peut masquer la carte : on le ferme avant de vérifier.
- hideKeyboard
- assertVisible: ".*Pâte à tartiner 400 g.*"
- assertNotVisible: ".*Soda cola.*"

# Ouvrir la fiche. Le nombre seul est ambigu (24 peut apparaître ailleurs) :
# on le repère par son testID « product-quantity », stable même si le
# texte ou le style changent.
- tapOn: ".*Pâte à tartiner 400 g.*"
- assertVisible:
    id: "product-quantity"
    text: "24"

# Modifier le stock : +2 puis -1. Les libellés d'accessibilité servent de sélecteurs.
- tapOn: "Ajouter une unité"
- tapOn: "Ajouter une unité"
# Vérifier après chaque étape : si un bouton ne répond plus, le scénario
# échoue ici, sur l'étape en cause, et non trois lignes plus bas.
- assertVisible:
    id: "product-quantity"
    text: "26"
- tapOn: "Retirer une unité"
- assertVisible:
    id: "product-quantity"
    text: "25"

# Le catalogue affiche la même valeur. Sur iOS, un élément accessible qui porte
# un libellé masque ses enfants : Maestro lit donc le libellé de la carte
# (« Ouvrir la fiche de ..., En stock · 25 »), pas le texte du badge.
- tapOn: "Retour au catalogue"
- assertVisible: ".*Pâte à tartiner 400 g.*En stock · 25.*"

# Remettre la donnée de départ : le scénario peut ainsi être rejoué sans
# `api:reset`. On passe par la fiche : dans le catalogue, « Retirer une
# unité » existe sur chaque carte et la recherche en affiche plusieurs.
- tapOn: ".*Pâte à tartiner 400 g.*"
- tapOn: "Retirer une unité"
- assertVisible:
    id: "product-quantity"
    text: "24"
- tapOn: "Retour au catalogue"

# Vider la recherche pour ne pas gêner le lancement suivant.
- tapOn: "Effacer la recherche"
